[project]
name = "kimi-k3-from-scratch"
version = "0.1.0"
description = "A from-scratch PyTorch implementation of the Kimi K3 language backbone, derived from the papers and verified with reference tests and experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.2",
    "huggingface-hub>=1.32.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "psutil>=7.2.2",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "torch>=2.11.0",
    "transformers>=5.17.0",
]

[project.optional-dependencies]
gpu = [
    "flash-linear-attention>=0.5.2",
    "triton-windows>=3.6,<3.7; sys_platform == 'win32'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
