# 20 optimizer updates to check finite loss/gradients and checkpoint I/O.
batch_size: 1
seq_len: 128
learning_rate: 0.0003
weight_decay: 0.0
max_steps: 20
log_interval: 1
eval_interval: 20
eval_batches: 1
checkpoint_interval: 20
overfit_batch: false
gradient_accumulation_steps: 1
precision: fp32
adam_beta1: 0.9
adam_beta2: 0.95
adam_eps: 1.0e-08
adam_fused: true
lr_schedule: constant
warmup_steps: 0
decay_steps: 1000
min_lr_ratio: 0.1
max_grad_norm: 1.0
seed: 1337
