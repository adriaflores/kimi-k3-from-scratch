# Repeat one batch for at most 2000 updates; inspect whether train loss falls below 0.1.
batch_size: 1
seq_len: 128
learning_rate: 0.0003
weight_decay: 0.0
max_steps: 2000
log_interval: 10
eval_interval: 100
eval_batches: 1
checkpoint_interval: 100
overfit_batch: true
gradient_accumulation_steps: 1
precision: fp32
adam_beta1: 0.9
adam_beta2: 0.95
adam_eps: 1.0e-08
adam_fused: true
muon_momentum: 0.95
muon_ns_steps: 5
muon_ns_dtype: bf16
muon_compile: false
qk_clip_threshold: 100.0
qk_clip_chunk_size: 256
lr_schedule: constant
warmup_steps: 0
decay_steps: 1000
min_lr_ratio: 0.1
max_grad_norm: 1.0
seed: 1337
