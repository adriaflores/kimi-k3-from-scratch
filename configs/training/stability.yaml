# 1000 updates on successive batches, including warmup and cosine decay.
batch_size: 1
seq_len: 128
learning_rate: 0.0003
weight_decay: 0.1
max_steps: 1000
log_interval: 10
eval_interval: 100
eval_batches: 4
checkpoint_interval: 100
overfit_batch: false
gradient_accumulation_steps: 4
precision: fp32
adam_beta1: 0.9
adam_beta2: 0.95
adam_eps: 1.0e-08
lr_schedule: cosine
warmup_steps: 100
decay_steps: 1000
min_lr_ratio: 0.1
max_grad_norm: 1.0
seed: 1337
