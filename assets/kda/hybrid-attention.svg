<svg xmlns="http://www.w3.org/2000/svg" width="760" height="208" viewBox="0 0 760 208" role="img" aria-labelledby="title desc">
<title id="title">The repeating hybrid attention schedule in Kimi K3</title>
<desc id="desc">Three consecutive Kimi Delta Attention layers are followed by one Gated MLA layer. This diagram shows attention modules only.</desc>
<rect x=".5" y=".5" width="759" height="207" rx="5" fill="#f8faff" stroke="#e0e6f3"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="28" y="32" font-size="12" letter-spacing="1.2" fill="#64758e">HYBRID ATTENTION</text><text x="732" y="32" text-anchor="end" font-size="12" fill="#64758e">REPEATING GROUP · 3 : 1</text>
<g stroke="#8c9ac0" stroke-width="1.5" fill="none"><path d="M180 93h29m-5-4 5 4-5 4M358 93h29m-5-4 5 4-5 4M536 93h29m-5-4 5 4-5 4"/></g>
<g fill="#eaf0ff" stroke="#bbc9f1"><rect x="28" y="61" width="152" height="64" rx="4"/><rect x="206" y="61" width="152" height="64" rx="4"/><rect x="384" y="61" width="152" height="64" rx="4"/></g>
<rect x="562" y="61" width="170" height="64" rx="4" fill="#243652"/>
<g fill="#294bc9" text-anchor="middle" font-size="19" font-weight="600"><text x="104" y="100">KDA</text><text x="282" y="100">KDA</text><text x="460" y="100">KDA</text></g><text x="647" y="100" fill="#fff" text-anchor="middle" font-size="19" font-weight="500">Gated MLA</text>
<path d="M28 141v6h508v-6" stroke="#bbc9f1" fill="none"/>
<text x="282" y="175" text-anchor="middle" font-size="14" fill="#64758e">Mix tokens through recurrent memory</text>
<text x="647" y="175" text-anchor="middle" font-size="14" fill="#64758e">Full attention</text>
</g></svg>
