<svg xmlns="http://www.w3.org/2000/svg" width="360" height="481" viewBox="0 0 360 481" role="img"><title>Scalar and channel-wise forgetting</title><g font-family="Segoe UI,Arial,sans-serif"><g transform="translate(0 0)"><rect x=".5" y=".5" width="359" height="231" rx="5" fill="#fafbfe" stroke="#e0e6f3"/><text x="20" y="29" font-size="13" letter-spacing=".7" fill="#294bc9">GATED DELTANET</text><text x="20" y="61" font-size="18" fill="#243652">a = 0.70</text><rect x="32" y="81" width="41" height="32" rx="2" fill="#7290da"/><rect x="78" y="81" width="41" height="32" rx="2" fill="#7290da"/><rect x="124" y="81" width="41" height="32" rx="2" fill="#7290da"/><rect x="170" y="81" width="41" height="32" rx="2" fill="#7290da"/><rect x="32" y="119" width="41" height="32" rx="2" fill="#7290da"/><rect x="78" y="119" width="41" height="32" rx="2" fill="#7290da"/><rect x="124" y="119" width="41" height="32" rx="2" fill="#7290da"/><rect x="170" y="119" width="41" height="32" rx="2" fill="#7290da"/><text x="247" y="103" font-size="17" fill="#64758e">70%</text><text x="247" y="141" font-size="17" fill="#64758e">70%</text><text x="20" y="187" font-size="15" fill="#64758e">One rate for the whole head.</text><text x="20" y="213" font-size="13" fill="#79869c">Color shows retention, not stored values.</text></g><g transform="translate(0 249)"><rect x=".5" y=".5" width="359" height="231" rx="5" fill="#fafbfe" stroke="#e0e6f3"/><text x="20" y="29" font-size="13" letter-spacing=".7" fill="#294bc9">KIMI DELTA ATTENTION</text><text x="20" y="61" font-size="18" fill="#243652">α = (0.95, 0.10)</text><rect x="32" y="81" width="41" height="32" rx="2" fill="#365dcc"/><rect x="78" y="81" width="41" height="32" rx="2" fill="#365dcc"/><rect x="124" y="81" width="41" height="32" rx="2" fill="#365dcc"/><rect x="170" y="81" width="41" height="32" rx="2" fill="#365dcc"/><rect x="32" y="119" width="41" height="32" rx="2" fill="#e3e9f9"/><rect x="78" y="119" width="41" height="32" rx="2" fill="#e3e9f9"/><rect x="124" y="119" width="41" height="32" rx="2" fill="#e3e9f9"/><rect x="170" y="119" width="41" height="32" rx="2" fill="#e3e9f9"/><text x="247" y="103" font-size="17" fill="#64758e">95%</text><text x="247" y="141" font-size="17" fill="#64758e">10%</text><text x="20" y="187" font-size="15" fill="#64758e">A rate for each key channel.</text><text x="20" y="213" font-size="13" fill="#79869c">Color shows retention, not stored values.</text></g></g></svg>