<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
  <title id="title">Two ways to access earlier tokens</title>
  <desc id="desc">The upper row shows a sequence compressed into one evolving recurrent state. The lower row shows the current query selecting information from individual earlier keys and values.</desc>
  <rect width="900" height="380" rx="10" fill="#101722"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="29" y="37" fill="#B5C4DC" font-size="13" font-weight="600" letter-spacing="1.5">RECURRENT STATE</text>
    <text x="29" y="59" fill="#8E9DB2" font-size="14">Summarize the prefix in an evolving state</text>
    <g font-size="14" text-anchor="middle">
      <rect x="34" y="88" width="94" height="51" rx="6" fill="#1C2A3E" stroke="#526984"/><text x="81" y="120" fill="#EDF1F9">token 1</text>
      <rect x="167" y="88" width="94" height="51" rx="6" fill="#1C2A3E" stroke="#526984"/><text x="214" y="120" fill="#EDF1F9">token 2</text>
      <rect x="300" y="88" width="94" height="51" rx="6" fill="#1C2A3E" stroke="#526984"/><text x="347" y="120" fill="#EDF1F9">token 3</text>
      <rect x="562" y="78" width="286" height="72" rx="7" fill="#223655" stroke="#8FB7FF"/><text x="705" y="109" fill="#DDE8FF" font-weight="600">state after token 3</text><text x="705" y="128" fill="#AAC3E7" font-size="12">fixed-size summary</text>
    </g>
    <g stroke="#8FB7FF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M128 113h31"/><path d="m151 107 8 6-8 6"/>
      <path d="M261 113h31"/><path d="m284 107 8 6-8 6"/>
      <path d="M394 113h156"/><path d="m542 107 8 6-8 6"/>
    </g>
    <path d="M29 185H871" stroke="#324055" stroke-width="1"/>
    <text x="29" y="215" fill="#B5C4DC" font-size="13" font-weight="600" letter-spacing="1.5">CONTENT-BASED ATTENTION</text>
    <text x="29" y="237" fill="#8E9DB2" font-size="14">Use a query to address earlier representations</text>
    <g font-size="14" text-anchor="middle">
      <rect x="34" y="267" width="130" height="53" rx="6" fill="#1C2A3E" stroke="#526984"/><text x="99" y="298" fill="#EDF1F9">key/value 1</text>
      <rect x="194" y="267" width="130" height="53" rx="6" fill="#1C2A3E" stroke="#526984"/><text x="259" y="298" fill="#EDF1F9">key/value 2</text>
      <rect x="354" y="267" width="130" height="53" rx="6" fill="#1C2A3E" stroke="#526984"/><text x="419" y="298" fill="#EDF1F9">key/value 3</text>
      <rect x="632" y="261" width="216" height="65" rx="7" fill="#223655" stroke="#8FB7FF"/><text x="740" y="290" fill="#DDE8FF" font-weight="600">current query</text><text x="740" y="311" fill="#AAC3E7" font-size="12">selects what to read</text>
    </g>
    <g stroke="#8FB7FF" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M632 279 168 279" stroke-dasharray="5 5" opacity=".6"/><path d="M632 294H328" stroke-dasharray="5 5" opacity=".75"/><path d="M632 311H488" stroke-width="2"/><path d="m498 305-10 6 10 6" stroke-width="2"/>
    </g>
    <text x="29" y="359" fill="#75859D" font-size="12">Conceptual illustration · not an exact computational diagram of KDA or MLA</text>
  </g>
</svg>
